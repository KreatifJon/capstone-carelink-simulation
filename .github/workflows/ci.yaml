name: "Terraform CI (PR Verification)"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Required for GitHub OIDC token generation
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linting and Format Checking
  # ---------------------------------------------------------------------------
  lint:
    name: "Terraform Lint & Validate"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Check Formatting
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # ---------------------------------------------------------------------------
  # Snyk Security Scan (Runs at root to read .snyk file)
  # ---------------------------------------------------------------------------
  snyk-scan:
    name: "Snyk IaC Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Snyk IaC Test
        uses: snyk/actions/iac@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: "."
          args: --severity-threshold=high

  # ---------------------------------------------------------------------------
  # Staging Plan with OIDC Token Inspector
  # ---------------------------------------------------------------------------
  plan-staging:
    name: "Terraform Plan (staging)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, snyk-scan]
    # No `environment:` on purpose: a protected environment would pause every PR for approval.
    # Planning uses the read-only plan role (trusted on the pull_request claim).

    defaults:
      run:
        working-directory: ./infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }} # repo variable; never commit an address (public repo)
      TF_VAR_project: carelink-sim

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # DIAGNOSTIC STEP: Prints the exact JSON payload GitHub sends to AWS STS
      # KEEP until the `sub` printed here (for a pull_request run) has been compared with
      # the patterns in oicd-bootstrap/iam-hardening.tf; then remove this step.
      # -----------------------------------------------------------------------
      - name: Inspect GitHub OIDC Token
        run: |
          echo "=== Requesting OIDC Token from GitHub Runner ==="
          RAW_TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            -H "User-Agent: actions/runner" \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          
          echo "=== Decoded OIDC Token Claims ==="
          jq -R 'split(".") | .[1] | @base64d | fromjson' <<< "$RAW_TOKEN"

      - name: Configure AWS Credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=sim/staging/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Plan
        run: terraform plan -input=false -lock=false -var="environment=staging" -no-color

  # ---------------------------------------------------------------------------
  # Production Plan
  # ---------------------------------------------------------------------------
  plan-production:
    name: "Terraform Plan (production)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, snyk-scan]
    # No `environment:` on purpose (see plan-staging): the production plan must not pause for approval.

    defaults:
      run:
        working-directory: ./infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }} # repo variable; never commit an address (public repo)
      TF_VAR_project: carelink-sim

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=sim/production/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Plan
        run: terraform plan -input=false -lock=false -var="environment=production" -no-color
