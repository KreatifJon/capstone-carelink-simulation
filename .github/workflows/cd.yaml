name: "Terraform CD (Deploy to Environments)"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Pre-deployment Security Gate (Runs at root to read .snyk file)
  # ---------------------------------------------------------------------------
  snyk-scan:
    name: "Snyk Pre-Deployment Security Check"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Snyk IaC Test
        uses: snyk/actions/iac@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: "."
          args: --severity-threshold=high

  # ---------------------------------------------------------------------------
  # Staging Deployment
  # ---------------------------------------------------------------------------
  apply-staging:
    name: "Deploy to Staging"
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Apply requires headroom for EKS and RDS creation times
    needs: snyk-scan
    environment: staging
    concurrency: terraform-staging # never two applies on one state

    defaults:
      run:
        working-directory: ./infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }} # repo variable; never commit an address (public repo)
      TF_VAR_project: carelink-sim

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Staging)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=sim/staging/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Plan
        run: terraform plan -input=false -var="environment=staging" -no-color -out=tfplan

      - name: Terraform Apply (exactly the plan above)
        run: terraform apply -input=false -no-color tfplan

  # ---------------------------------------------------------------------------
  # Production preview (runs BEFORE the approval gate, read-only role, no pause)
  # ---------------------------------------------------------------------------
  plan-production:
    name: "Preview Production Changes"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: apply-staging

    defaults:
      run:
        working-directory: ./infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_project: carelink-sim

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=sim/production/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Plan (summary shown on the run page)
        shell: bash # explicit shell so `tee` cannot hide a plan failure (pipefail)
        run: |
          terraform plan -input=false -lock=false -var="environment=production" -no-color | tee plan.txt
          { echo '### Production plan'; echo '```'; tail -n 60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Production Deployment (Requires Manual UI Approval)
  # ---------------------------------------------------------------------------
  apply-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: plan-production
    environment: production  # Pauses run until approved in GitHub UI
    concurrency: terraform-production

    defaults:
      run:
        working-directory: ./infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }} # repo variable; never commit an address (public repo)
      TF_VAR_project: carelink-sim

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Production)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=sim/production/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Plan
        run: terraform plan -input=false -var="environment=production" -no-color -out=tfplan

      - name: Terraform Apply (exactly the plan above)
        run: terraform apply -input=false -no-color tfplan
